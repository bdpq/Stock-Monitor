<style>
/*
 * 极简纯透明补丁（可回退）
 *
 * 目标：主面板只显示「文字 + 图标」，去掉一切背景色块，不加模糊/高光/描边。
 *
 * 生效条件：html.sm-transparent 类，由 transparent.js 根据配置项 backAlpha 决定。
 *   - 用户把设置页「背景透明度」拉到最低（backAlpha <= 10）→ 加类，纯透明生效；
 *   - 调回任意不透明值 → 移除类，界面 100% 恢复原样。
 *
 * 作用域：全部规则限制在 #table（主面板）内，设置页 / 弹层 / 其它窗口完全不受影响。
 * 只改 background* 与表格底色变量，不碰 color / 涨跌幅红绿 / 边框 / 图标。
 */

/* 1. 面板根：内联 style 的 background 必须用 !important 才能盖掉 */
html.sm-transparent #table {
    background: transparent !important;
    background-color: transparent !important;
    background-image: none !important;
}

/*
 * 2. Element Plus 表格：Vue  prop 与 CSS 变量写死了白底
 *    --el-fill-color-blank = #ffffff 是行/表头的源头，这里在面板内就地改掉。
 */
html.sm-transparent #table {
    --el-fill-color-blank: transparent !important;
    --el-fill-color-light: transparent !important;
    --el-bg-color: transparent !important;
    --el-bg-color-overlay: transparent !important;
    --el-table-tr-bg-color: transparent !important;
    --el-table-header-bg-color: transparent !important;
    --el-table-row-hover-bg-color: transparent !important;
    --el-table-current-row-bg-color: transparent !important;
}

html.sm-transparent #table .el-table,
html.sm-transparent #table .el-table__inner-wrapper,
html.sm-transparent #table .el-table tr,
html.sm-transparent #table .el-table th.el-table__cell,
html.sm-transparent #table .el-table td.el-table__cell,
html.sm-transparent #table .el-table__cell,
html.sm-transparent #table .el-table__header-wrapper,
html.sm-transparent #table .el-table__body-wrapper,
html.sm-transparent #table .el-table__fixed,
html.sm-transparent #table .el-table__fixed-right {
    background: transparent !important;
    background-color: transparent !important;
    background-image: none !important;
}

/* 3. 悬停 / 选中行：Element Plus 默认给浅灰底，这里一并抹掉 */
html.sm-transparent #table .el-table__body tr:hover > td.el-table__cell,
html.sm-transparent #table .el-table__body tr.current-row > td.el-table__cell,
html.sm-transparent #table .el-table__row:hover,
html.sm-transparent #table .el-table__cell:hover {
    background-color: transparent !important;
}

/* 4. 分组栏 / 底部工具条：同样带内联背景，去掉后只剩按钮文字与图标 */
html.sm-transparent #table #groupsbox,
html.sm-transparent #table #groupsbox .el-button,
html.sm-transparent #table #groupsbox .el-tag {
    background: transparent !important;
    background-color: transparent !important;
    box-shadow: none !important;
}
</style>
<!-- sm:transparent-css:end -->
</head>

<body>
  <div id="app">
  </div>
  <!-- sm:drag-sort:start -->
<script>
/**
 * 渲染层补丁：自选股表格「首列拖拽排序」。
 *
 * 背景：渲染层（Vue 3）原始源码已丢失，无法直接改其源码，只能通过
 * scripts/inject-renderer.mjs 把本脚本「幂等注入」到打包后的 index.html
 * （在 Vue 应用挂载之后执行）。因此本文件是「外挂增强」，只在运行时操作 DOM，
 * 不依赖 Vue 内部实现，靠 Element Plus 表格的固定 class 选择器工作。
 *
 * 工作原理：
 *   1. 只在「股票名」首列按下时，才给该行设置 draggable=true（避免与按钮/右键菜单/
 *      文本选择冲突）
 *   2. 利用 HTML5 原生 Drag & Drop：dragstart 记录拖拽行，dragover 依据「光标在目标
 *      行上半还是下半」动态显示蓝色插入线（上/下），drop 时算出目标位置并调用后端
 *   3. 通过 ipc 两个通道完成持久化：
 *        - config 'get'                 → 读取当前自选股 keys 与别名 alias
 *        - api 'sortKeys' {from,to,after} → 通知主进程调整顺序并保存
 *   4. 用「显示的股票名文本」反查 key（因为拖拽拿到的只有 DOM 文本，没有 key），
 *      优先匹配别名，其次匹配原名。
 */
/* 自选股拖拽排序：仅“股票名”第一列可作为拖拽手柄 */
(function () {
  var req = window.require || (typeof require !== 'undefined' ? require : null);
  if (!req) return;
  var ipc;
  try { ipc = req('electron').ipcRenderer; } catch (e) { return; }

  var dragRow = null, indicator = null;

  function tableEl() { return document.getElementById('mainTable'); }
  function bodyRows() {
    var t = tableEl();
    return t ? Array.prototype.slice.call(t.querySelectorAll('.el-table__body-wrapper tbody tr.el-table__row')) : [];
  }
  function nameCell(row) { return row ? row.querySelector('td:first-child') : null; }
  function clearIndicator() {
    var t = tableEl();
    if (t) Array.prototype.forEach.call(t.querySelectorAll('.sm-drop-before,.sm-drop-after'),
      function (r) { r.classList.remove('sm-drop-before', 'sm-drop-after'); });
    indicator = null;
  }
  function endDrag() {
    if (dragRow) {
      dragRow.classList.remove('sm-dragging');
      dragRow.removeAttribute('draggable');
      dragRow = null;
    }
    clearIndicator();
  }

  /* 仅在按下“股票名”首列时才允许该行发起拖拽，避免与按钮/右键菜单/文本选择冲突 */
  document.addEventListener('mousedown', function (e) {
    var t = tableEl();
    if (!t || !e.target.closest) return;
    var cell = e.target.closest('td');
    if (!cell || !t.contains(cell)) return;
    if (cell.parentNode.querySelector('td:first-child') !== cell) return;
    var row = cell.closest('tr.el-table__row');
    if (row) row.setAttribute('draggable', 'true');
  }, true);
  document.addEventListener('mouseup', function () {
    bodyRows().forEach(function (r) {
      if (!r.classList.contains('sm-dragging')) r.removeAttribute('draggable');
    });
  }, true);

  document.addEventListener('dragstart', function (e) {
    if (!e.target.closest || !tableEl()) return;
    var row = e.target.closest('tr.el-table__row');
    if (!row || !tableEl().contains(row)) return;
    dragRow = row;
    row.classList.add('sm-dragging');
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', 'sm-reorder'); } catch (_) {}
    }
  });
  document.addEventListener('dragover', function (e) {
    if (!dragRow || !e.target.closest) return;
    var row = e.target.closest('tr.el-table__row');
    if (!row || row === dragRow || !tableEl().contains(row)) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    var rect = row.getBoundingClientRect();
    var after = e.clientY > rect.top + rect.height / 2;
    if (indicator !== row || indicator._smAfter !== after) {
      clearIndicator();
      row.classList.add(after ? 'sm-drop-after' : 'sm-drop-before');
      indicator = row;
      indicator._smAfter = after;
    }
  });
  document.addEventListener('drop', function (e) {
    if (!dragRow || !e.target.closest) { endDrag(); return; }
    var row = e.target.closest('tr.el-table__row');
    if (row && row !== dragRow && tableEl().contains(row)) {
      e.preventDefault();
      var rect = row.getBoundingClientRect();
      var after = e.clientY > rect.top + rect.height / 2;
      var fromText = nameCell(dragRow) ? nameCell(dragRow).textContent.trim() : '';
      var toText = nameCell(row) ? nameCell(row).textContent.trim() : '';
      reorder(fromText, toText, after);
    }
    endDrag();
  });
  document.addEventListener('dragend', endDrag);

  async function reorder(fromText, toText, after) {
    try {
      // 读取当前自选股配置（keys 顺序 + alias 别名），用于文本 -> key 的反查
      var cfg = await ipc.invoke('config', 'get');
      var keys = (cfg && cfg.keys) || [];
      var alias = (cfg && cfg.alias) || {};
      // 把「单元格里显示的文本」还原成唯一 key：优先别名、其次原名
      function keyOf(text) {
        if (!text) return null;
        for (var i = 0; i < keys.length; i++) {
          var k = keys[i];
          var disp = alias[k.key] || k.name;
          if (disp && (text === disp || text.indexOf(disp) >= 0)) return k.key;
        }
        return null;
      }
      var fromKey = keyOf(fromText), toKey = keyOf(toText);
      // 有效、且起点终点不同才真正下发；after=true 表示插入到目标行之后
      if (fromKey && toKey && fromKey !== toKey) {
        await ipc.invoke('api', 'sortKeys', { from: fromKey, to: toKey, after: !!after });
      }
    } catch (err) {
      console.log('sortKeys error:', err);
    }
  }

  // 拖拽所需的最小 CSS：首列鼠标为 move、拖拽行半透明、插入线（上/下蓝线）样式
  var style = document.createElement('style');
  style.textContent =
    '#mainTable .el-table__row td:first-child{cursor:move}' +
    '#mainTable .sm-dragging{opacity:.35}' +
    '#mainTable .sm-drop-before td{box-shadow:inset 0 2px 0 0 #238CF7}' +
    '#mainTable .sm-drop-after td{box-shadow:inset 0 -2px 0 0 #238CF7}';
  document.head.appendChild(style);
})();
</script>
<!-- sm:drag-sort:end -->
<!-- sm:transparent-js:start -->
<script>
/**
 * 极简纯透明补丁的运行时开关。
 *
 * 背景：设置页的「背景透明度」只能改 #table 面板自身的 background，
 *       Element Plus 表格行/表头写死了 --el-fill-color-blank:#fff，
 *       因此光拉滑条仍会残留一行行白底。本脚本负责在透明度拉到最低时
 *       给 <html> 加 sm-transparent 类，让 transparent.css 生效。
 *
 * 设计：不新增配置项、不新增托盘开关，完全跟随用户熟悉的 backAlpha：
 *   - backAlpha <= THRESHOLD → 加类（纯透明，只显示文字和图标）
 *   - 其它值                → 移除类（界面 100% 恢复原样）
 *
 * 触发时机：
 *   1. 页面初始化时读一次配置；
 *   2. 用 MutationObserver 监听 #table 的 style 变化（Vue 改 backAlpha 会改内联 background），
 *      这样在设置页拉动滑条后无需重启即可即时生效；
 *   3. 低频兜底轮询，防止 observer 因 DOM 重建漏掉事件。
 *
 * 只在主面板（存在 #table）时挂类，设置页/其它窗口不会受到影响。
 */
(function () {
  var THRESHOLD = 10; // backAlpha 0~255，<=10 视为「背景透明度拉到最低」
  var cls = 'sm-transparent';
  var req = window.require || (typeof require !== 'undefined' ? require : null);
  if (!req) return;
  var ipc;
  try { ipc = req('electron').ipcRenderer; } catch (e) { return; }

  var lastAlpha = null;

  function apply(alpha) {
    if (typeof alpha !== 'number' || isNaN(alpha)) return;
    // 关键：必须先确认主面板存在，再更新 lastAlpha。
    // 若页面刚加载、#table 尚未挂载时就把读到的 alpha 记进 lastAlpha，
    // 等表格出现后再读到同一个值会被「值未变」去重直接跳过，导致类永远加不上。
    var table = document.getElementById('table');
    if (!table) return; // 设置页等没有主面板的窗口：不记录、不挂类

    // 合计行容器（表格外的独立 div）没有自己的内联背景，原本恒透明；
    // 这里把 #table 当前的背景色同步成 CSS 变量，让它跟随「背景透明度」滑条。
    // 必须在去重之前执行，否则只改背景色、alpha 不变时不会更新。
    var bg = table.style.background || table.style.backgroundColor || '';
    if (bg) document.documentElement.style.setProperty('--sm-sum-bg', bg);

    if (alpha === lastAlpha) return;
    lastAlpha = alpha;
    if (alpha <= THRESHOLD) document.documentElement.classList.add(cls);
    else document.documentElement.classList.remove(cls);
  }

  // 从 #table 的内联 background 解析 alpha（hex8 或 rgba），用作即时判断
  function alphaFromStyle() {
    var table = document.getElementById('table');
    if (!table || !table.style) return null;
    var bg = table.style.background || table.style.backgroundColor || '';
    var m = /^#([0-9a-f]{8})$/i.exec(bg.trim());
    if (m) return Math.round(parseInt(m[1].slice(6, 8), 16) / 255 * 255);
    m = /rgba?\(([^)]+)\)/i.exec(bg);
    if (m) {
      var parts = m[1].split(',');
      var a = parts.length > 3 ? parseFloat(parts[3]) : 1;
      return isNaN(a) ? null : Math.round(a * 255);
    }
    return null;
  }

  function syncFromConfig() {
    if (!ipc || typeof ipc.invoke !== 'function') return;
    ipc.invoke('config', 'get').then(function (cfg) {
      if (cfg && typeof cfg.backAlpha === 'number') apply(cfg.backAlpha);
    }).catch(function () {});
  }

  // 1. 初始化：配置读取 + 内联样式双保险
  syncFromConfig();
  apply(alphaFromStyle());

  // 2. 即时响应滑条：监听 body 子树与 style 属性变化
  try {
    var observer = new MutationObserver(function () {
      var a = alphaFromStyle();
      if (a !== null) apply(a);
    });
    observer.observe(document.documentElement, {
      subtree: true, childList: true, attributes: true, attributeFilter: ['style']
    });
  } catch (e) {}

  // 3. 兜底轮询：DOM 重建或 observer 漏事件时，最多 2 秒后自动纠正
  setInterval(syncFromConfig, 2000);
})();
</script>
<!-- sm:transparent-js:end -->
</body>
